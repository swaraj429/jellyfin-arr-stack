name: Jellyfin-stack

services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: unless-stopped

    ports:
      - "8096:8096"

    volumes:
      - /home/swaraj/services/media/config/jellyfin/config:/config
      - /home/swaraj/services/media/config/jellyfin/cache:/cache
      - /home/swaraj/services/media/data/library:/media:ro

    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1

    group_add:
      - "44"
      - "993"

    environment:
      - TZ=Asia/Kolkata
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080

    volumes:
      - /home/swaraj/services/media/config/qbittorrent:/config
      - /home/swaraj/services/media/data:/data
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata

    volumes:
      - /home/swaraj/services/media/config/sonarr:/config
      - /home/swaraj/services/media/data:/data
  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata

    volumes:
      - /home/swaraj/services/media/config/radarr:/config
      - /home/swaraj/services/media/data:/data
  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata

    volumes:
      - /home/swaraj/services/media/config/prowlarr:/config
  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped

    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Kolkata
  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped

    environment:
      - TZ=Asia/Kolkata

    ports:
      - "5055:5055"

    volumes:
      - /home/swaraj/services/media/config/seerr:/app/config

    depends_on:
      - jellyfin
      - sonarr
      - radarr

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:latest
    hostname: fidler-media
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    devices:
      - /dev/net/tun:/dev/net/tun

    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      TS_AUTH_ONCE: "true"
    volumes:
      - /home/swaraj/services/media/config/tailscale:/var/lib/tailscale

    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"

    entrypoint: ["/var/lib/tailscale/start.sh"]

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config
    networks:
      - default

  dashboard:
    build:
      context: ./dashboard
    container_name: media-dashboard
    restart: unless-stopped
    environment:
      CADDY_API: http://caddy:2019
    networks:
      - default
